name: "Restore cache"
description: "Restores the CMake build cache + vcpkg binary cache"

inputs:
  vcpkg_cache_dir:
    description: "Directory used for the vcpkg binary cache"
    required: true
    type: string

runs:
  using: "composite"
  steps:
    - name: Restore vcpkg binary cache
      uses: actions/cache@v4
      with:
        path: ${{ inputs.vcpkg_cache_dir }}
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}
        restore-keys: ${{ runner.os }}-vcpkg-

    - name: Restore CMake FetchContent cache
      uses: actions/cache@v4
      with:
        path: build/*/_deps
        key: ${{ runner.os }}-fetchcontent-${{ hashFiles('CMakeLists.txt') }}
        restore-keys: ${{ runner.os }}-fetchcontent-
