name: Release Nightly (Linux, x86-64)

on:
  push:
    paths: &workflow_paths
      - '**.cpp'
      - '**.h'
      - '**.c'
      - '**.cc'
      - '**.cxx'
      - '**.hh'
      - '**.hpp'
      - '**.hxx'
      - '**.inl'
      - "**/CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - '.github/workflows/release-linux.yml'
  workflow_dispatch:

env:
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_cache,readwrite"

jobs:
  release-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build pkg-config curl zip unzip tar git python3 \
            libx11-dev libxft-dev libxext-dev \
            libgl-dev libglu1-mesa-dev libpthread-stubs0-dev \
            patchelf

      - name: Install LLVM 20 + libc++
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          sudo apt-get install -y libc++-20-dev libc++abi-20-dev
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 100

      - name: Install CMake 3.30
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "3.30.5"

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: "vcpkg.json"

      - name: Restore build caches
        uses: ./.github/actions/restore-cache
        with:
          vcpkg_cache_dir: ${{ github.workspace }}/vcpkg_cache

      - name: Configure
        run: cmake --preset linux-clang

      - name: Build
        run: cmake --build --preset linux-clang-release -j $(nproc)

      - name: Package artifact
        run: |
          cd build/linux-clang/targets/app/Release
          zip -r ../../../../../minecraft-client-linux.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-client-linux-${{ github.sha }}
          path: minecraft-client-linux.zip
          retention-days: 7

      - name: Create nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly
          prerelease: true
          files: minecraft-client-linux.zip
