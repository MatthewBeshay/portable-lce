name: Build (Linux, x86-64)

on:
  push:
    paths: &workflow_paths
      - "**.cppm"
      - "**.ixx"
      - "**.inl"
      - "**.mpp"
      - "**.ipp"
      - "**.tpp"
      - "**.txx"
      - "**.inc"
      - "**.cpp"
      - "**.hpp"
      - "**.cxx"
      - "**.hxx"
      - "**.cc"
      - "**.hh"
      - "**.c"
      - "**.h"
      - ".github/workflows/build-linux.yml"
      - "**/CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"

  pull_request:
    paths: *workflow_paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'dev/') }}

env:
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_cache,readwrite"

jobs:
  build-linux-clang:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build pkg-config curl zip unzip tar git python3 \
            libx11-dev libxft-dev libxext-dev \
            libgl-dev libglu1-mesa-dev libpthread-stubs0-dev

      - name: Install LLVM 20 + libc++
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          sudo apt-get install -y libc++-20-dev libc++abi-20-dev
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 100

      - name: Install CMake 3.30
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "3.30.5"

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: "vcpkg.json"

      - name: Restore build caches
        uses: ./.github/actions/restore-cache
        with:
          vcpkg_cache_dir: ${{ github.workspace }}/vcpkg_cache

      - name: Configure + Build
        uses: ./.github/actions/build-cmake
        with:
          preset: linux-clang
          build_preset: linux-clang-release
          artifact_name: minecraft-client-linux-clang
